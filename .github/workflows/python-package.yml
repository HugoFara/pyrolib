# Install dependencies, lint, build and test across the supported Python versions.
# See: https://docs.github.com/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install package and test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[tests]"

    - name: Lint with ruff (errors)
      uses: astral-sh/ruff-action@v3
      with:
        args: check --select E9,F63,F7,F82 --output-format=github .

    - name: Lint with ruff (full, advisory)
      continue-on-error: true
      uses: astral-sh/ruff-action@v3
      with:
        args: check --output-format=github .

    - name: Test with pytest
      run: pytest

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install package and doc dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[docs]"

    # Warnings are errors here so doc rot fails CI instead of the published site.
    - name: Build the documentation
      run: python -m sphinx -b html -W --keep-going docs docs/_build/html

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Build sdist and wheel
      run: |
        python -m pip install --upgrade pip build twine
        python -m build

    - name: Check metadata
      run: twine check --strict dist/*

    # Guards against regressing the package-data globs: the fuel databases live
    # in a subdirectory that an earlier `data/*.y*ml` pattern silently missed.
    - name: Verify packaged data files
      run: |
        python -m zipfile -l dist/*.whl | grep 'pyrolib/data/Default_MNH_namelist.yml'
        python -m zipfile -l dist/*.whl | grep 'pyrolib/data/fuel_db/DefaultSA.yml'
        python -m zipfile -l dist/*.whl | grep 'pyrolib/data/fuel_db/FireFluxI.yml'

    - uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
